name: Release

# Started by hand from the Actions tab. Runs the tests first, then builds the Android APK, the
# Windows zip, the Windows installer and the Mac app with the raised version, and only when all of
# them succeed commits the new version to DAC70Setup.csproj, tags it and attaches the files to a
# draft GitHub release, which is published by hand after review.
#
# Started on another branch than main, it only builds the files and attaches them to the run as
# artifacts, without committing, tagging or releasing anything.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Part of the version to raise (none releases the current csproj version)'
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: patch

permissions:
  contents: write

concurrency:
  group: release

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: src/DAC70Setup/DAC70Setup.csproj

jobs:
  test:
    uses: ./.github/workflows/test.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-code: ${{ steps.version.outputs.version-code }}
    env:
      BUMP: ${{ inputs.bump }}

    steps:
      - uses: actions/checkout@v7

      - name: Work out the version
        id: version
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $text = [IO.File]::ReadAllText($env:PROJECT)

          $display = [regex]::Match($text, '<ApplicationDisplayVersion>(\d+)\.(\d+)\.(\d+)</ApplicationDisplayVersion>')
          $code = [regex]::Match($text, '<ApplicationVersion>(\d+)</ApplicationVersion>')
          if (-not $display.Success -or -not $code.Success)
          {
              throw "$env:PROJECT needs <ApplicationDisplayVersion> in the form X.Y.Z and a whole number <ApplicationVersion>."
          }

          $major = [int]$display.Groups[1].Value
          $minor = [int]$display.Groups[2].Value
          $patch = [int]$display.Groups[3].Value
          $versionCode = [int]$code.Groups[1].Value

          switch ($env:BUMP)
          {
              'major' { $major++; $minor = 0; $patch = 0 }
              'minor' { $minor++; $patch = 0 }
              'patch' { $patch++ }
          }
          if ($env:BUMP -ne 'none')
          {
              $versionCode++
          }
          $version = "$major.$minor.$patch"

          if (git ls-remote --tags origin "refs/tags/v$version")
          {
              throw "Tag v$version already exists."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "version-code=$versionCode" >> $env:GITHUB_OUTPUT
          "Building $version (versionCode $versionCode)"

  windows:
    name: Android and Windows
    needs: [test, version]
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_CODE: ${{ needs.version.outputs.version-code }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.4xx'

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install the MAUI workload
        run: dotnet workload install maui

      - name: Decode the Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: >
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\release.keystore",
          [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))

      - name: Publish Android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          dotnet publish $env:PROJECT -c Release -f net10.0-android -o publish/android
          "-p:ApplicationDisplayVersion=$env:VERSION"
          "-p:ApplicationVersion=$env:VERSION_CODE"
          -p:AndroidKeyStore=true
          "-p:AndroidSigningKeyStore=$env:RUNNER_TEMP\release.keystore"
          -p:AndroidSigningKeyAlias=dac70setup
          -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
          -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD

      - name: Verify the APK signature
        run: |
          $buildTools = Get-ChildItem "$env:ANDROID_HOME\build-tools" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          & "$($buildTools.FullName)\apksigner.bat" verify -v --print-certs publish/android/cz.muni.fi.xbalota.dac70setup-Signed.apk

      - name: Publish Windows
        run: >
          dotnet publish $env:PROJECT -c Release -f net10.0-windows10.0.19041.0 -o publish/windows/DAC70Setup
          "-p:ApplicationDisplayVersion=$env:VERSION"
          "-p:ApplicationVersion=$env:VERSION_CODE"

      - name: Package the release files
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item publish/android/cz.muni.fi.xbalota.dac70setup-Signed.apk "release/DAC70Setup-v$env:VERSION-android.apk"
          7z a -tzip "release/DAC70Setup-v$env:VERSION-windows-x64.zip" ./publish/windows/DAC70Setup

      # Inno Setup is preinstalled on the windows-2025 image
      - name: Build the Windows installer
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $iscc = Get-Item "C:\Program Files*\Inno Setup *\ISCC.exe" | Select-Object -Last 1
          & $iscc.FullName "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\publish\windows\DAC70Setup" "/O$PWD\release" installer/DAC70Setup.iss

      - uses: actions/upload-artifact@v7
        with:
          name: android-windows
          path: release/
          if-no-files-found: error

  mac:
    name: Mac Catalyst
    needs: [test, version]
    runs-on: xcode-27
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_CODE: ${{ needs.version.outputs.version-code }}

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.4xx'

      - name: Install the MAUI workload
        run: dotnet workload install maui --version 10.404.0

      - name: Publish Mac Catalyst
        run: >
          dotnet publish $env:PROJECT -c Release -f net10.0-maccatalyst -p:CreatePackage=false
          "-p:ApplicationDisplayVersion=$env:VERSION"
          "-p:ApplicationVersion=$env:VERSION_CODE"

      - name: Package the app
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $app = @(Get-ChildItem src/DAC70Setup/bin/Release/net10.0-maccatalyst -Directory -Filter *.app)
          if ($app.Count -ne 1)
          {
              Get-ChildItem src/DAC70Setup/bin -Directory -Filter *.app -Recurse | ForEach-Object FullName
              throw "Expected one .app in src/DAC70Setup/bin/Release/net10.0-maccatalyst, found $($app.Count)."
          }
          codesign --verify --deep --strict --verbose=2 $app[0].FullName
          codesign --display --entitlements - $app[0].FullName
          New-Item -ItemType Directory -Force release | Out-Null
          # ditto keeps the symlinks and attributes inside the .app that a plain zip would lose
          ditto -c -k --sequesterRsrc --keepParent $app[0].FullName "release/DAC70Setup-v$env:VERSION-macos.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: release/
          if-no-files-found: error

  release:
    needs: [version, windows, mac]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_CODE: ${{ needs.version.outputs.version-code }}
      BUMP: ${{ inputs.bump }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Commit and tag the version
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ($env:BUMP -ne 'none')
          {
              $text = [IO.File]::ReadAllText($env:PROJECT)
              $text = $text -replace '<ApplicationDisplayVersion>[^<]*</ApplicationDisplayVersion>', "<ApplicationDisplayVersion>$env:VERSION</ApplicationDisplayVersion>"
              $text = $text -replace '<ApplicationVersion>[^<]*</ApplicationVersion>', "<ApplicationVersion>$env:VERSION_CODE</ApplicationVersion>"
              [IO.File]::WriteAllText($env:PROJECT, $text, [Text.UTF8Encoding]::new($true))

              git add $env:PROJECT
              git commit -m "build: raise the version to $env:VERSION"
          }
          git tag -a "v$env:VERSION" -m "DAC-70 Setup $env:VERSION"

          # The tag stays on the commit that was built. If main moved on while the builds ran,
          # the version commit is merged into it instead of being pushed on top of an old main.
          $released = git rev-parse HEAD
          git fetch origin main
          git switch --detach FETCH_HEAD
          git merge --no-edit -m "build: merge the version $env:VERSION into main" $released
          git push --atomic origin HEAD:main "v$env:VERSION"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v$env:VERSION" --draft --verify-tag
          --title "v$env:VERSION" --notes ""
          (Get-ChildItem release).FullName
