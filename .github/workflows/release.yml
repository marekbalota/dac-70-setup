name: Release

# Started by hand from the Actions tab. Raises the version in DAC70Setup.csproj, builds the
# Android APK and the Windows zip, and only when both succeed commits the new version, tags it
# and attaches the files to a draft GitHub release, which is published by hand after review.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Part of the version to raise (none releases the current csproj version)'
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: patch

permissions:
  contents: write

concurrency:
  group: release

defaults:
  run:
    shell: pwsh

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PROJECT: src/DAC70Setup/DAC70Setup.csproj
      BUMP: ${{ inputs.bump }}

    steps:
      - uses: actions/checkout@v7

      - name: Raise the version
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $text = [IO.File]::ReadAllText($env:PROJECT)

          $display = [regex]::Match($text, '<ApplicationDisplayVersion>(\d+)\.(\d+)\.(\d+)</ApplicationDisplayVersion>')
          $code = [regex]::Match($text, '<ApplicationVersion>(\d+)</ApplicationVersion>')
          if (-not $display.Success -or -not $code.Success)
          {
              throw "$env:PROJECT needs <ApplicationDisplayVersion> in the form X.Y.Z and a whole number <ApplicationVersion>."
          }

          $major = [int]$display.Groups[1].Value
          $minor = [int]$display.Groups[2].Value
          $patch = [int]$display.Groups[3].Value
          $versionCode = [int]$code.Groups[1].Value

          switch ($env:BUMP)
          {
              'major' { $major++; $minor = 0; $patch = 0 }
              'minor' { $minor++; $patch = 0 }
              'patch' { $patch++ }
          }
          if ($env:BUMP -ne 'none')
          {
              $versionCode++
          }
          $version = "$major.$minor.$patch"

          if (git ls-remote --tags origin "refs/tags/v$version")
          {
              throw "Tag v$version already exists."
          }

          $text = $text -replace '<ApplicationDisplayVersion>[^<]*</ApplicationDisplayVersion>', "<ApplicationDisplayVersion>$version</ApplicationDisplayVersion>"
          $text = $text -replace '<ApplicationVersion>[^<]*</ApplicationVersion>', "<ApplicationVersion>$versionCode</ApplicationVersion>"
          [IO.File]::WriteAllText($env:PROJECT, $text, [Text.UTF8Encoding]::new($true))

          "VERSION=$version" >> $env:GITHUB_ENV
          "Releasing $version (versionCode $versionCode)"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.4xx'

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install the MAUI workload
        run: dotnet workload install maui

      - name: Decode the Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: >
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\release.keystore",
          [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))

      - name: Publish Android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          dotnet publish $env:PROJECT -c Release -f net10.0-android -o publish/android
          -p:AndroidKeyStore=true
          "-p:AndroidSigningKeyStore=$env:RUNNER_TEMP\release.keystore"
          -p:AndroidSigningKeyAlias=dac70setup
          -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
          -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD

      - name: Verify the APK signature
        run: |
          $buildTools = Get-ChildItem "$env:ANDROID_HOME\build-tools" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          & "$($buildTools.FullName)\apksigner.bat" verify -v --print-certs publish/android/cz.muni.fi.xbalota.dac70setup-Signed.apk

      - name: Publish Windows
        run: dotnet publish $env:PROJECT -c Release -f net10.0-windows10.0.19041.0 -o publish/windows/DAC70Setup

      - name: Package the release files
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item publish/android/cz.muni.fi.xbalota.dac70setup-Signed.apk "release/DAC70Setup-v$env:VERSION-android.apk"
          7z a -tzip "release/DAC70Setup-v$env:VERSION-windows-x64.zip" ./publish/windows/DAC70Setup

      - name: Commit and tag the version
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ($env:BUMP -ne 'none')
          {
              git add $env:PROJECT
              git commit -m "build: raise the version to $env:VERSION"
          }
          git tag -a "v$env:VERSION" -m "DAC-70 Setup $env:VERSION"
          git push --atomic origin HEAD:main "v$env:VERSION"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v$env:VERSION" --draft --verify-tag
          --title "DAC-70 Setup $env:VERSION" --notes ""
          (Get-ChildItem release).FullName
